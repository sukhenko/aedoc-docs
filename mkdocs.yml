site_name: Довідка AEDOC з інтеграції еАкциз та навчання роботи з системою
site_description: Довідка AEDOC з інтеграції еАкциз та навчання роботи з системою
site_url: https://dovidka.aedoc.com.ua/
copyright: © WebCheck — <a href="https://aedoc.com.ua">aedoc.com.ua</a>

theme:
  name: material
  language: uk
  logo: https://aedoc.com.ua/wp-content/uploads/2026/05/favicon-512x512-1.png
  favicon: https://aedoc.com.ua/wp-content/uploads/2026/05/favicon-512x512-1.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
  palette:
    primary: custom
    accent: custom

nav:
  - Головна: index.md
  - Інтеграція:
      - integratsiia/index.md
      - Технічна документація: integratsiia/itdeptinfo.md
      - Зберігання даних:
          - integratsiia/zberigannia/index.md
          - Тестування: integratsiia/zberigannia/testuvannia.md
          - Зовнішнє сховище MS SQL: integratsiia/zberigannia/zovnishnie-skhovyshche.md
      - HTTP-сервіс «Сховище марок»:
          - integratsiia/skhovyshche-marok/index.md
          - Для розробників (API): integratsiia/skhovyshche-marok/rozrobnykam.md
  - Навчання роботи з АЕДок:
      - navchannia/index.md
      - Перший запуск:
          - pershyi-zapusk/index.md
          - 1. Реєстрація в еАкциз: pershyi-zapusk/reiestratsiia-eo.md
          - 2. API-токен: pershyi-zapusk/api-token.md
          - 3. Помічник додавання ЕО: pershyi-zapusk/pomichnyk-eo.md
          - 4. Підпис і доступи: pershyi-zapusk/nastupni-kroky.md
      - Робота з АЕД:
          - aed/index.md
          - АЕД №1:
              - Прийняти вхідний АЕД №1: aed/pryiom-vkhidnoho-aed.md
              - Відхилити вхідний АЕД №1: aed/vidkhylennia-aed1.md
          - АЕД №4:
              - Повернути товар на підставі АЕД №1: aed/aed4-povernennia.md
      - Довідники:
          - dovidnyky/index.md
          - Користувачі ЕО та ключ ЕЦП: dovidnyky/korystuvachi-eo-kliuch.md
          - Контрагенти ЕО (створення, доступ):
              - Новий контрагент ЕО: dovidnyky/dodaty-kontragenta-eo.md
              - Торгові об'єкти та доступи: dovidnyky/dostup-do-obiektiv.md
  - Тестування:
      - testuvannia/index.md
      - Роздріб ред.1 + ПРРО: testuvannia/rozdrib-prro.md

extra_css:
  - stylesheets/extra.css?v=20261009-2
extra_javascript:
  - javascripts/lightbox.js?v=20261009-2

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html
  - tables
  - toc:
      permalink: true
