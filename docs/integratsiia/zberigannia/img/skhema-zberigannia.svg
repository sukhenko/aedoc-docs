<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Схема: табличні частини документів та дані обміну переносяться у зовнішню базу MS SQL, регістр статусів марок залишається в основній базі 1С">
  <rect x="10" y="10" width="270" height="280" rx="10" fill="#ffffff" stroke="#3D6BA0" stroke-width="2"/>
  <text x="145" y="36" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Основна база (1С/BAS)</text>

  <rect x="28" y="54" width="234" height="48" rx="6" fill="#eef2f6" stroke="#c7cdd6"/>
  <text x="145" y="73" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#6B7280" text-decoration="line-through">Табличні частини документів</text>
  <text x="145" y="89" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#9aa1ab">переносяться →</text>

  <rect x="28" y="112" width="234" height="48" rx="6" fill="#eef2f6" stroke="#c7cdd6"/>
  <text x="145" y="131" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#6B7280" text-decoration="line-through">Дані обміну еАкциз</text>
  <text x="145" y="147" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#9aa1ab">переносяться →</text>

  <rect x="28" y="170" width="234" height="90" rx="6" fill="#e8f0f9" stroke="#3D6BA0" stroke-width="1.5"/>
  <text x="145" y="192" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">Регістр статусів марок</text>
  <text x="145" y="210" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#3f4552">завжди залишається</text>
  <text x="145" y="225" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#3f4552">для отримання поточного</text>
  <text x="145" y="240" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#3f4552">статусу марки</text>

  <path d="M282 76 L358 76" stroke="#D9B84A" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M282 136 L358 136" stroke="#D9B84A" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D9B84A"/>
    </marker>
  </defs>

  <rect x="360" y="10" width="270" height="280" rx="10" fill="#fffaf0" stroke="#D9B84A" stroke-width="2"/>
  <text x="495" y="36" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Зовнішня база MS SQL</text>

  <rect x="378" y="60" width="234" height="52" rx="6" fill="#faf3de" stroke="#e6c877"/>
  <text x="495" y="81" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">Табличні частини документів</text>
  <text x="495" y="97" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#a3822f">акцизні марки документів</text>

  <rect x="378" y="122" width="234" height="52" rx="6" fill="#faf3de" stroke="#e6c877"/>
  <text x="495" y="143" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">Дані обміну еАкциз</text>
  <text x="495" y="159" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#a3822f">JSON, квитанції, службові файли</text>
</svg>
