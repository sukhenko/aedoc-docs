<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 450" font-family="Inter, Montserrat, Segoe UI, Arial, sans-serif" role="img" aria-label="Схема: еАкциз, облікова система, Сховище марок, каса ПРРО / РРО і ЦОД РРО">
  <defs>
    <marker id="mk-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="mk-ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D6BA0"/></marker>
    <filter id="mk-sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1A1A1A" flood-opacity="0.08"/></filter>
  </defs>

  <!-- ===== зв'язки ===== -->
  <!-- облікова система -> сховище : статуси (2) -->
  <line x1="274" y1="100" x2="452" y2="100" stroke="#3D6BA0" stroke-width="2.2" marker-end="url(#mk-ahb)"/>
  <circle cx="300" cy="80" r="11" fill="#fff" stroke="#3D6BA0"/><text x="300" y="84.5" text-anchor="middle" font-size="12" font-weight="700" fill="#3D6BA0">2</text>
  <text x="318" y="85" font-size="13" fill="#1A1A1A">Статуси марок</text>
  <!-- сховище -> облікова система : продажі (5) -->
  <line x1="454" y1="140" x2="276" y2="140" stroke="#3D6BA0" stroke-width="2.2" marker-end="url(#mk-ahb)"/>
  <circle cx="300" cy="162" r="11" fill="#fff" stroke="#3D6BA0"/><text x="300" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#3D6BA0">5</text>
  <text x="318" y="167" font-size="13" fill="#1A1A1A">Продажі з № чека</text>

  <!-- каса -> сховище : перевірка і продаж (3) -->
  <line x1="866" y1="100" x2="688" y2="100" stroke="#6B7280" stroke-width="1.6" marker-end="url(#mk-ah)"/>
  <circle cx="714" cy="80" r="11" fill="#fff" stroke="#3D6BA0"/><text x="714" y="84.5" text-anchor="middle" font-size="12" font-weight="700" fill="#3D6BA0">3</text>
  <text x="732" y="85" font-size="13" fill="#1A1A1A">Перевірка і продаж</text>
  <line x1="688" y1="140" x2="866" y2="140" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mk-ah)"/>
  <text x="714" y="167" font-size="12" fill="#6B7280">можна / вже продано</text>

  <!-- еАкциз -> облікова система : АЕД (1) -->
  <line x1="156" y1="298" x2="156" y2="182" stroke="#3D6BA0" stroke-width="2.2" marker-end="url(#mk-ahb)"/>
  <circle cx="182" cy="232" r="11" fill="#fff" stroke="#3D6BA0"/><text x="182" y="236.5" text-anchor="middle" font-size="12" font-weight="700" fill="#3D6BA0">1</text>
  <text x="200" y="230" font-size="13" font-weight="700" fill="#3D6BA0">АЕД</text>
  <text x="200" y="248" font-size="12" fill="#6B7280">API Excise · КЕП</text>

  <!-- каса -> ЦОД РРО : чек ПРРО (4) -->
  <line x1="984" y1="182" x2="984" y2="298" stroke="#6B7280" stroke-width="1.6" marker-end="url(#mk-ah)"/>
  <circle cx="958" cy="232" r="11" fill="#fff" stroke="#3D6BA0"/><text x="958" y="236.5" text-anchor="middle" font-size="12" font-weight="700" fill="#3D6BA0">4</text>
  <text x="940" y="237" text-anchor="end" font-size="13" fill="#1A1A1A">Чек ПРРО / РРО</text>

  <!-- ЦОД РРО -> еАкциз : акцизні марки -->
  <line x1="866" y1="380" x2="274" y2="380" stroke="#6B7280" stroke-width="1.6" marker-end="url(#mk-ah)"/>
  <text x="570" y="370" text-anchor="middle" font-size="13" fill="#1A1A1A">Акцизні марки з чека</text>

  <!-- ===== вузли ===== -->
  <!-- облікова система -->
  <g filter="url(#mk-sh)">
    <rect x="40" y="60" width="232" height="120" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="40" y="60" width="4" height="120" fill="#3D6BA0"/>
  </g>
  <text x="64" y="94" font-size="20" font-weight="700" fill="#1A1A1A">BAS</text>
  <text x="64" y="116" font-size="13" fill="#6B7280">Облікова система</text>
  <text x="64" y="134" font-size="13" fill="#6B7280">з підсистемою AEDOC</text>
  <text x="64" y="162" font-size="12" font-weight="600" fill="#3D6BA0">Регістр марок — головний</text>

  <!-- сховище марок -->
  <g filter="url(#mk-sh)">
    <rect x="454" y="44" width="232" height="152" rx="6" fill="#F3F6FA" stroke="#3D6BA0"/>
    <rect x="454" y="44" width="4" height="152" fill="#3D6BA0"/>
  </g>
  <text x="478" y="80" font-size="20" font-weight="700" fill="#1A1A1A">Сховище марок</text>
  <text x="478" y="102" font-size="13" fill="#6B7280">HTTP-сервіс AEDOC</text>
  <text x="478" y="120" font-size="13" fill="#6B7280">окрема база MS SQL</text>
  <text x="478" y="148" font-size="12" font-weight="600" fill="#3D6BA0">Відповідь касі за мить</text>
  <text x="478" y="168" font-size="12" fill="#6B7280">Повтор продажу — відмова</text>

  <!-- каса -->
  <g filter="url(#mk-sh)">
    <rect x="868" y="60" width="232" height="120" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="868" y="60" width="4" height="120" fill="#83B735"/>
  </g>
  <text x="892" y="94" font-size="20" font-weight="700" fill="#1A1A1A">Каса</text>
  <text x="892" y="116" font-size="13" fill="#6B7280">Робоче місце касира</text>
  <text x="892" y="134" font-size="13" fill="#6B7280">ПРРО / РРО</text>

  <!-- еАкциз -->
  <g filter="url(#mk-sh)">
    <rect x="40" y="300" width="232" height="120" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="40" y="300" width="4" height="120" fill="#D9B84A"/>
  </g>
  <text x="64" y="336" font-size="20" font-weight="700" fill="#1A1A1A">еАкциз</text>
  <text x="64" y="358" font-size="13" fill="#6B7280">Електронна система</text>
  <text x="64" y="376" font-size="13" fill="#6B7280">обігу акцизних марок</text>
  <text x="64" y="404" font-size="12" fill="#6B7280">xtrace.gov.ua</text>

  <!-- ЦОД РРО -->
  <g filter="url(#mk-sh)">
    <rect x="868" y="300" width="232" height="120" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="868" y="300" width="4" height="120" fill="#1A1A1A"/>
  </g>
  <text x="892" y="336" font-size="20" font-weight="700" fill="#1A1A1A">ЦОД РРО</text>
  <text x="892" y="358" font-size="13" fill="#6B7280">Сервер фіскалізації</text>
  <text x="892" y="376" font-size="13" fill="#6B7280">ДПС України</text>
</svg>
