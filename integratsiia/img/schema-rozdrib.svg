<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="100%" style="height:auto;display:block" font-family="Inter, Montserrat, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D6BA0"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E8F1F"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1A1A1A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1120" height="600" fill="#fafbfc"/>

  <!-- ===== зв'язки ===== -->
  <!-- Функції → ERP -->
  <line x1="180" y1="120" x2="220" y2="120" stroke="#3D6BA0" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- ERP ↔ Сервер обліку -->
  <line x1="420" y1="120" x2="500" y2="120" stroke="#3D6BA0" stroke-width="1.8" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
  <text x="460" y="106" text-anchor="middle" font-size="12" fill="#1A1A1A">підпис</text>
  <text x="460" y="142" text-anchor="middle" font-size="11" fill="#6B7280">HTTP</text>

  <!-- Сервер обліку ↔ еАкциз : АЕД (головний зв'язок) -->
  <line x1="610" y1="210" x2="610" y2="440" stroke="#3D6BA0" stroke-width="2.2" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
  <rect x="530" y="292" width="160" height="56" rx="4" fill="#fafbfc"/>
  <text x="610" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#3D6BA0">АЕД · КЕП</text>
  <text x="610" y="334" text-anchor="middle" font-size="12" fill="#6B7280">API Excise</text>

  <!-- Сервер обліку ↔ Хмара AEDOC -->
  <line x1="720" y1="120" x2="860" y2="120" stroke="#6B7280" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="790" y="106" text-anchor="middle" font-size="12" fill="#1A1A1A">залишки марок</text>
  <text x="790" y="140" text-anchor="middle" font-size="12" fill="#1A1A1A">продажі кас</text>

  <!-- Хмара ↔ Офлайн клієнт : режим «з облікової програми» -->
  <line x1="1000" y1="180" x2="1000" y2="278" stroke="#5E8F1F" stroke-width="1.8" marker-start="url(#ah-green)" marker-end="url(#ah-green)"/>
  <text x="1012" y="212" font-size="11" font-weight="600" fill="#5E8F1F">з облікової</text>
  <text x="1012" y="226" font-size="11" font-weight="600" fill="#5E8F1F">програми</text>

  <!-- Офлайн клієнт ↔ еАкциз : режим «з еАкциз» -->
  <line x1="800" y1="320" x2="712" y2="450" stroke="#5E8F1F" stroke-width="1.6" stroke-dasharray="6 4" marker-start="url(#ah-green)" marker-end="url(#ah-green)"/>
  <text x="750" y="366" text-anchor="end" font-size="11" font-weight="600" fill="#5E8F1F">з еАкциз:</text>
  <text x="742" y="382" text-anchor="end" font-size="11" fill="#6B7280">залишок, погашення</text>

  <!-- ПРРО → ЦОД РРО : чек -->
  <line x1="950" y1="412" x2="950" y2="470" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="960" y="446" font-size="12" fill="#1A1A1A">Чек ПРРО</text>

  <!-- ЦОД РРО → еАкциз : марки -->
  <line x1="860" y1="525" x2="712" y2="525" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="786" y="515" text-anchor="middle" font-size="12" fill="#1A1A1A">Акцизні марки</text>
  <text x="786" y="545" text-anchor="middle" font-size="11" fill="#6B7280">«Погашено ЕМ»</text>

  <!-- ERP ↔ ТСД -->
  <line x1="320" y1="200" x2="320" y2="300" stroke="#6B7280" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="332" y="254" font-size="12" fill="#1A1A1A">Протокол сканування</text>

  <!-- ===== вузли ===== -->
  <!-- Функції підсистеми -->
  <g filter="url(#sh)">
    <rect x="20" y="40" width="160" height="200" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="20" y="40" width="4" height="200" fill="#3D6BA0"/>
  </g>
  <text x="40" y="68" font-size="13" font-weight="700" fill="#1A1A1A">Функції підсистеми</text>
  <text x="40" y="94" font-size="12" fill="#6B7280">Підпис АЕД</text>
  <text x="40" y="114" font-size="12" fill="#6B7280">ПпН</text>
  <text x="40" y="134" font-size="12" fill="#6B7280">УГІ</text>
  <text x="40" y="154" font-size="12" fill="#6B7280">Імпорт</text>
  <text x="40" y="174" font-size="12" fill="#6B7280">Інвентаризація марок</text>
  <text x="40" y="194" font-size="12" fill="#6B7280">Переміщення марок</text>
  <text x="40" y="214" font-size="12" fill="#6B7280">Звіти еАкциз</text>

  <!-- ERP -->
  <g filter="url(#sh)">
    <rect x="220" y="40" width="200" height="160" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="220" y="40" width="4" height="160" fill="#3D6BA0"/>
  </g>
  <text x="242" y="74" font-size="20" font-weight="700" fill="#1A1A1A">ERP</text>
  <text x="242" y="96" font-size="13" fill="#6B7280">Облікова система</text>
  <text x="242" y="114" font-size="13" fill="#6B7280">з підсистемою AEDOC</text>
  <text x="242" y="148" font-size="12" font-weight="600" fill="#3D6BA0">УТП · УТ · КУП · Мал. Бізнес</text>
  <text x="242" y="168" font-size="12" fill="#6B7280">розширення або</text>
  <text x="242" y="184" font-size="12" fill="#6B7280">конфігурація інтеграції</text>

  <!-- Сервер обліку AEDoc -->
  <g filter="url(#sh)">
    <rect x="500" y="40" width="220" height="170" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="500" y="40" width="4" height="170" fill="#3D6BA0"/>
  </g>
  <text x="522" y="72" font-size="17" font-weight="700" fill="#1A1A1A">Сервер обліку AEDoc</text>
  <text x="522" y="92" font-size="12" fill="#6B7280">служба AEDOC на ПК з BAS</text>
  <text x="522" y="108" font-size="12" fill="#6B7280">або на сервері 1С</text>
  <text x="522" y="136" font-size="12" fill="#1A1A1A">• підпис КЕП</text>
  <text x="522" y="156" font-size="12" fill="#1A1A1A">• сховище марок MS SQL</text>
  <text x="522" y="176" font-size="12" fill="#1A1A1A">• обмін з касами</text>
  <text x="522" y="196" font-size="11" fill="#6B7280">сховище і хмара — за потреби</text>

  <!-- Хмара AEDOC -->
  <g filter="url(#sh)">
    <rect x="860" y="60" width="240" height="120" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="860" y="60" width="4" height="120" fill="#7A9CC6"/>
  </g>
  <text x="882" y="92" font-size="18" font-weight="700" fill="#1A1A1A">Хмара AEDOC</text>
  <text x="882" y="114" font-size="12" fill="#6B7280">зв'язок сервера обліку</text>
  <text x="882" y="130" font-size="12" fill="#6B7280">з віддаленими магазинами</text>
  <text x="882" y="158" font-size="12" fill="#6B7280">каса — за 6-значним кодом</text>

  <!-- Каса магазину -->
  <g filter="url(#sh)">
    <rect x="800" y="240" width="300" height="186" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="800" y="240" width="4" height="186" fill="#83B735"/>
  </g>
  <text x="820" y="266" font-size="16" font-weight="700" fill="#1A1A1A">Каса магазину</text>
  <rect x="818" y="278" width="266" height="64" rx="5" fill="#F3F8EA" stroke="#C9DFA6"/>
  <text x="830" y="298" font-size="13" font-weight="700" fill="#1A1A1A">AEDoc Офлайн клієнт для ПРРО</text>
  <text x="830" y="316" font-size="11" fill="#6B7280">залишок марок на диску каси</text>
  <text x="830" y="332" font-size="11" fill="#6B7280">працює й без інтернету</text>
  <line x1="900" y1="344" x2="900" y2="362" stroke="#6B7280" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="910" y="358" font-size="11" fill="#6B7280">перевірка марки · продаж</text>
  <rect x="818" y="364" width="266" height="48" rx="5" fill="#fff" stroke="#E5E7EB"/>
  <text x="830" y="384" font-size="13" font-weight="700" fill="#1A1A1A">ПРРО / РРО</text>
  <text x="830" y="402" font-size="11" fill="#6B7280">робоче місце касира</text>

  <!-- ТСД -->
  <g filter="url(#sh)">
    <rect x="240" y="300" width="160" height="96" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="240" y="300" width="4" height="96" fill="#6B7280"/>
  </g>
  <text x="260" y="326" font-size="16" font-weight="700" fill="#1A1A1A">ТСД</text>
  <text x="260" y="346" font-size="12" fill="#6B7280">Приймання товару</text>
  <text x="260" y="364" font-size="12" fill="#6B7280">в магазині</text>
  <text x="260" y="382" font-size="12" fill="#6B7280">та на складі</text>

  <!-- еАкциз -->
  <g filter="url(#sh)">
    <rect x="510" y="440" width="200" height="120" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="510" y="440" width="4" height="120" fill="#D9B84A"/>
  </g>
  <text x="532" y="476" font-size="20" font-weight="700" fill="#1A1A1A">еАкциз</text>
  <text x="532" y="498" font-size="13" fill="#6B7280">Електронна система</text>
  <text x="532" y="516" font-size="13" fill="#6B7280">обігу акцизних марок</text>
  <text x="532" y="544" font-size="12" fill="#6B7280">xtrace.gov.ua</text>

  <!-- ЦОД РРО -->
  <g filter="url(#sh)">
    <rect x="860" y="470" width="200" height="100" rx="6" fill="#fff" stroke="#E5E7EB"/>
    <rect x="860" y="470" width="4" height="100" fill="#1A1A1A"/>
  </g>
  <text x="882" y="504" font-size="20" font-weight="700" fill="#1A1A1A">ЦОД РРО</text>
  <text x="882" y="526" font-size="13" fill="#6B7280">Сервер фіскалізації</text>
  <text x="882" y="544" font-size="13" fill="#6B7280">ДПС України</text>
</svg>
