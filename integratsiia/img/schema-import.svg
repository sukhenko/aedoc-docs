<svg width="100%" style="height:auto;display:block" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<title>Ланцюг імпорту еАкциз</title>
<desc>П'ять етапів від замовлення марок до відвантаження, зі станами марок між ними.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="60" y="30" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="200" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">1. Повідомлення УІ</text>
<text x="200" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Замовлення марок, сплата акцизу</text>

<rect x="380" y="36" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Неактивована → Активована</text>

<line x1="200" y1="86" x2="200" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="118" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="200" y="136" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">2. Наміри ввезення</text>
<text x="200" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Одна партія — один намір</text>

<line x1="200" y1="174" x2="200" y2="206" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="206" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="200" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">3. Митне оформлення</text>
<text x="200" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Резерв суми, декларація</text>

<rect x="380" y="212" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">→ Розмитнена</text>

<line x1="200" y1="262" x2="200" y2="294" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="294" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="200" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">4. ОВП (тип 075)</text>
<text x="200" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Оприбуткування на склад</text>

<rect x="380" y="300" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="322" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">→ На складі</text>

<line x1="200" y1="350" x2="200" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="378" width="280" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="200" y="393" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">5. АЕД на відвантаження</text>
</svg>
