name: Publish docs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7" "mkdocs-git-revision-date-localized-plugin==1.6.0"
      - run: mkdocs gh-deploy --force
